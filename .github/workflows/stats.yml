name: Refresh profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # STATS_TOKEN: a PAT that can read the organization repositories I commit to.
      # Without it the script exits and the committed SVGs stay as they are.
      - run: node scripts/stats.mjs
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commit if changed
        run: |
          git diff --quiet -- assets && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh profile stats"
          git push
